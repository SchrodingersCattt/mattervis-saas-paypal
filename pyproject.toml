[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mattervis-saas"
version = "0.1.0"
description = "Stateless MatterVis rendering and structure-analysis API"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "Flask>=3.0",
    "matter-vis==0.0.5",
    "molcrys-kit==0.7.0",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
runtime = [
    "matter-vis[web,plotly-export,cube,animation]==0.0.5",
]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.8"]

[project.scripts]
mattervis-saas = "mattervis_saas.app:main"
mattervis-api = "mattervis_saas.cli:main"
mattervis-saas-cleanup = "mattervis_saas.maintenance:main"
mattervis-figure = "contest.app:main"

[tool.setuptools.packages.find]
include = ["mattervis_saas*", "contest*"]

[tool.setuptools.package-data]
contest = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
